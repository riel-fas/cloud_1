---
# UFW Host Firewall Configuration
# Mandatory Cloud-1 requirement: Only ports 22, 80, and 443 accessible from outside.

- name: Ensure UFW is installed
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set UFW default incoming policy to deny
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set UFW default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow SSH on port 22
  community.general.ufw:
    rule: allow
    port: '22'
    from_ip: '{{ admin_allowed_cidr }}'
    proto: tcp
    comment: 'Cloud-1 SSH management'

- name: Allow HTTP on port 80
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
    comment: 'Cloud-1 HTTP web traffic (redirects to HTTPS)'

- name: Allow HTTPS on port 443
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp
    comment: 'Cloud-1 HTTPS secure web traffic'

- name: Enable UFW service and ensure it runs on boot
  community.general.ufw:
    state: enabled
