[www]
; Pool name
user = nobody
group = nobody

; Listen on port 9000
listen = 9000

; Allow connections from any IP
listen.owner = nobody
listen.group = nobody
listen.mode = 0660

; Process management
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; PHP settings
php_admin_value[error_log] = /var/log/php82/error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M

; Clear environment
clear_env = no

